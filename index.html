<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 Userland · mansoor0x</title>
<style>
:root {
  --bg:     #030508;
  --bg2:    #080d14;
  --border: #0e1929;
  --blue:   #0057e0;
  --blue2:  #003bbf;
  --dim:    #2a3a55;
  --muted:  #4a6080;
  --text:   #c8d8f0;
  --bright: #e8f0ff;
  --green:  #00c896;
  --amber:  #f0b040;
  --red:    #e03030;
  --font:   "Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:   "Consolas","Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-user-select:none;user-select:none;overflow:hidden}

/* ── scanline overlay ── */
body::before{
  content:"";position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);
  pointer-events:none;z-index:999}

/* ── ambient glow ── */
body::after{
  content:"";position:fixed;
  top:-30%;left:50%;transform:translateX(-50%);
  width:70vw;height:60vh;
  background:radial-gradient(ellipse,rgba(0,87,224,.12) 0%,transparent 70%);
  pointer-events:none}

/* ── layout ── */
#root{
  position:relative;height:100vh;
  display:grid;
  grid-template-rows:1fr auto 1fr;
  align-items:center;justify-items:center;
  padding:24px}

/* ── top bar ── */
#topbar{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 28px;
  border-bottom:1px solid var(--border);
  background:rgba(3,5,8,.8);
  backdrop-filter:blur(12px);
  z-index:10}
.tb-brand{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.tb-brand b{color:var(--blue);font-weight:600}
.tb-fw{font-size:11px;font-family:var(--mono);color:var(--muted)}
.tb-fw span{color:var(--text)}

/* ── main card ── */
#card{
  width:min(560px,100%);
  display:flex;flex-direction:column;
  align-items:center;gap:0;
  position:relative;z-index:1}

/* title */
.title{
  font-size:clamp(26px,5vw,42px);
  font-weight:200;
  letter-spacing:-.02em;
  color:var(--bright);
  text-align:center;
  line-height:1.1;
  margin-bottom:6px}
.title b{font-weight:700;color:#fff}
.title .ps{color:var(--blue)}

.subtitle{
  font-size:13px;color:var(--muted);
  letter-spacing:.05em;margin-bottom:40px;
  text-align:center}
.subtitle b{color:var(--text)}

/* fw badge */
#fw-badge{
  display:flex;align-items:center;gap:10px;
  padding:10px 20px;
  border:1px solid var(--border);
  background:var(--bg2);
  border-radius:6px;
  font-family:var(--mono);font-size:13px;
  margin-bottom:28px;
  width:100%}
#fw-badge .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--dim);flex-shrink:0;
  transition:background .4s}
#fw-badge .dot.ok{background:var(--green);
  box-shadow:0 0 8px var(--green)}
#fw-badge .dot.warn{background:var(--amber)}
#fw-badge .dot.err{background:var(--red)}
#fw-badge .lbl{color:var(--muted);margin-right:4px}
#fw-badge .val{color:var(--bright);flex:1}
#fw-badge .tag{
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:3px;
  background:rgba(0,87,224,.15);color:var(--blue)}

/* info rows */
.info-rows{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:32px}
.info-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 16px;
  border:1px solid var(--border);
  background:var(--bg2);border-radius:5px;
  font-size:12px}
.info-row .k{color:var(--muted)}
.info-row .v{color:var(--text);font-family:var(--mono);font-size:11px}
.info-row .v.ok{color:var(--green)}
.info-row .v.warn{color:var(--amber)}
.info-row .v.none{color:var(--dim)}

/* CTA button */
#btn{
  width:100%;padding:18px;
  background:var(--blue);color:#fff;
  border:none;border-radius:6px;
  font:600 15px/1 var(--font);
  letter-spacing:.04em;text-transform:uppercase;
  cursor:pointer;
  position:relative;overflow:hidden;
  transition:background .2s,transform .1s;
  -webkit-user-select:none}
#btn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);
  pointer-events:none}
#btn:hover{background:#1a6aef}
#btn:active{transform:scale(.985)}
#btn.disabled{
  background:var(--dim);color:var(--muted);
  cursor:not-allowed;pointer-events:none}
#btn .arrow{margin-left:10px;opacity:.7;font-size:12px}

/* msg under button */
#msg{
  margin-top:14px;font-size:12px;
  color:var(--muted);text-align:center;min-height:18px}
#msg.err{color:var(--red)}
#msg.warn{color:var(--amber)}
#msg.ok{color:var(--green)}

/* ── footer ── */
#foot{
  font-size:11px;color:var(--dim);text-align:center;
  letter-spacing:.04em}
#foot b{color:var(--muted)}

/* ── loading pulse ── */
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.loading{animation:pulse 1.2s ease infinite}

/* ── offline pill ── */
#offline{
  position:fixed;bottom:16px;right:16px;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:3px;
  background:rgba(0,200,150,.12);color:var(--green);
  border:1px solid rgba(0,200,150,.2);
  opacity:0;transition:opacity .4s;
  pointer-events:none}
#offline.show{opacity:1}
</style>
</head>
<body>

<div id="topbar">
  <span class="tb-brand"><b>mansoor0x</b> · ps5 security research</span>
  <span class="tb-fw">WebKit Userland&nbsp;&nbsp;<span id="tb-fw-val">detecting…</span></span>
</div>

<div id="root">
  <div></div><!-- spacer -->

  <div id="card">
    <div class="title">
      <span class="ps">PS5</span> <b>Userland</b>
    </div>
    <div class="subtitle">WebKit Renderer Exploit &bull; by <b>mansoor0x</b> &bull; 2026</div>

    <div id="fw-badge">
      <span class="dot" id="fw-dot"></span>
      <span class="lbl">firmware</span>
      <span class="val" id="fw-val">detecting…</span>
      <span class="tag" id="fw-tag">—</span>
    </div>

    <div class="info-rows">
      <div class="info-row">
        <span class="k">offsets</span>
        <span class="v" id="i-off">—</span>
      </div>
      <div class="info-row">
        <span class="k">range</span>
        <span class="v ok">09.00 → 13.60</span>
      </div>
      <div class="info-row">
        <span class="k">exploit</span>
        <span class="v ok">WebKit heap — renderer notify</span>
      </div>
      <div class="info-row">
        <span class="k">cache</span>
        <span class="v" id="i-cache">—</span>
      </div>
    </div>

    <button id="btn" class="disabled">
      ▶ Launch Userland
      <span class="arrow">↗</span>
    </button>
    <div id="msg" class="loading">Loading offsets…</div>
  </div>

  <div id="foot">
    <b>mansoor0x</b> &bull; PS5 Security Research &bull; 2026
  </div>
</div>

<div id="offline">offline ready</div>

<script type="module">
import { OFFSETS, detectFirmware, resolve, TOTAL_FW } from "./modules/offsets.mjs";

const $ = id => document.getElementById(id);

// ── Firmware detection
const fw  = detectFirmware();
const res = fw ? resolve(fw) : null;
let entry = null;

$("tb-fw-val").textContent = fw || "unknown";

if (!fw) {
  $("fw-val").textContent   = "not a PS5 browser";
  $("fw-dot").className     = "dot err";
  $("fw-tag").textContent   = "unsupported";
  $("msg").textContent      = "Open on your PS5 browser";
  $("msg").className        = "err";
} else if (res) {
  entry = res.entry;
  $("fw-val").textContent   = fw;
  $("fw-dot").className     = "dot " + (res.exact ? "ok" : "warn");
  $("fw-tag").textContent   = res.exact ? "exact match" : "nearest: " + res.key;
  $("i-off").textContent    = res.exact ? "verified ✓" : "interpolated from " + res.key;
  $("i-off").className      = "v " + (res.exact ? "ok" : "warn");
  $("msg").textContent      = res.exact
    ? "Firmware " + fw + " fully supported"
    : "Using " + res.key + " offsets — unverified on " + fw;
  $("msg").className        = res.exact ? "ok" : "warn";
  $("btn").classList.remove("disabled");
} else {
  $("fw-val").textContent   = fw;
  $("fw-dot").className     = "dot err";
  $("fw-tag").textContent   = "no offsets";
  $("msg").textContent      = "Firmware " + fw + " not supported";
  $("msg").className        = "err";
}

// ── Launch
$("btn").addEventListener("click", () => {
  if (!entry) return;
  const q = new URLSearchParams();
  q.set("go","1"); q.set("fw", fw);
  q.set("hc",  entry.hc.join(","));
  q.set("gd",  entry.gd);
  q.set("notify", entry.nt);
  q.set("gps", entry.gps); q.set("gpe", entry.gpe);
  q.set("cls", entry.cls); q.set("cle", entry.cle);
  q.set("ers", entry.ers); q.set("ere", entry.ere);
  location.href = "exploit.html?" + q.toString();
});

// ── Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js")
    .then(r => {
      const sw = r.installing || r.waiting || r.active;
      const show = () => {
        $("i-cache").textContent  = "offline ready ✓";
        $("i-cache").className    = "v ok";
        $("offline").className    = "show";
        setTimeout(() => $("offline").className = "", 3000);
      };
      if (r.active) { show(); }
      else if (sw) { sw.addEventListener("statechange", e => { if(e.target.state==="activated") show(); }); }
    }).catch(() => {
      $("i-cache").textContent = "unavailable";
      $("i-cache").className   = "v none";
    });
} else {
  $("i-cache").textContent = "not supported";
  $("i-cache").className   = "v none";
}
</script>
</body>
</html>
